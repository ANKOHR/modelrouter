[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelrouter"
version = "0.1.0"
description = "Deterministic, rule-based model routing with illustrative synthetic fixtures"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
modelrouter = "modelrouter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
modelrouter = ["data/*.json"]
